name: Continuous Integration

on:
  push:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ghcr.io/cirruslabs/ubuntu-runner-arm64:22.04-md

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check format
        run: npm run format:check

      - name: Lint
        run: npm run lint

  check-dist:
    name: Check dist/
    runs-on: ghcr.io/cirruslabs/ubuntu-runner-arm64:22.04-md

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build dist/
        id: build
        run: npm run bundle

      - name: Find differences
        run: |
          if [ ! -d dist/ ]; then
            echo "Expected dist/ directory does not exist.  See status below:"
            ls -la ./
            exit 1
          fi
          if [ "$(git diff --ignore-space-at-eol --text dist/ | wc -l)" -gt "0" ]; then
            echo "Detected uncommitted changes after build. See status below:"
            git diff --ignore-space-at-eol --text dist/
            exit 1
          fi

  integration-test:
    name: Integration test
    strategy:
      matrix:
        image:
          - ghcr.io/cirruslabs/macos-runner:sonoma
          - ghcr.io/cirruslabs/ubuntu-runner-amd64:24.04-md
          - ghcr.io/cirruslabs/ubuntu-runner-arm64:24.04-md
    runs-on: ${{ matrix.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Swift
        if: runner.os == 'Linux'
        run: |
          curl -O https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz && \
          tar zxf swiftly-$(uname -m).tar.gz && \
          ./swiftly init --quiet-shell-followup && \
          . "${SWIFTLY_HOME_DIR:-$HOME/.local/share/swiftly}/env.sh" && \
          hash -r

      - name: Install APT packages required by Swift
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get -y install binutils unzip gnupg2 libcurl4-openssl-dev libgcc-13-dev libpython3-dev libstdc++-13-dev libxml2-dev libncurses-dev libz3-dev pkg-config zlib1g-dev

      - name: Export LINUX_SOURCEKIT_LIB_PATH
        if: runner.os == 'Linux'
        run: |
          echo "LINUX_SOURCEKIT_LIB_PATH=$(~/.local/share/swiftly/bin/swiftly use -p)/usr/lib" >> $GITHUB_ENV

      - name: Test SwiftLint Action (using latest SwiftLint)
        uses: ./

      - name: Test SwiftLint Action (using a specific version of SwiftLint)
        uses: ./
        with:
          version: 0.60.0
          args: --enable-all-rules
